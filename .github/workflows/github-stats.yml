name: Actualizar estadisticas de GitHub

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar estadisticas generales
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Oscar-Najera&show_icons=true&theme=tokyonight&locale=es"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generar lenguajes utilizados
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Oscar-Najera&layout=compact&langs_count=8&theme=tokyonight"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Guardar graficas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estadisticas"
            git push
          fi
